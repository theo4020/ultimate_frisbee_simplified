# Publie le jeu sur GitHub Pages à chaque push sur main.
# Les identifiants du relais TURN viennent des secrets du dépôt
# (Settings → Secrets and variables → Actions) et sont écrits dans js/secrets.js
# uniquement dans la version publiée : ils ne sont jamais commités.
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Générer js/secrets.js à partir des secrets du dépôt
        env:
          TURN_USER: ${{ secrets.TURN_USER }}
          TURN_PASS: ${{ secrets.TURN_PASS }}
          TURN_APP: ${{ secrets.TURN_APP }}
          TURN_KEY: ${{ secrets.TURN_KEY }}
        run: |
          node -e '
            const v = k => JSON.stringify(process.env[k] || "");
            require("fs").writeFileSync("js/secrets.js",
              "window.ULTIMATE_SECRETS = { TURN_USER: " + v("TURN_USER") + ", TURN_PASS: " + v("TURN_PASS") +
              ", TURN_APP: " + v("TURN_APP") + ", TURN_KEY: " + v("TURN_KEY") + " };\n");
          '

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
