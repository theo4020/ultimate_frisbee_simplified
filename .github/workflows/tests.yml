# Suite de tests complète (règles, serveur, interface, en ligne) à chaque push et pull request.
# Résultat : onglet « Actions » du dépôt (✅ ou ❌, avec le détail de chaque vérification).
name: Tests
on: [push, pull_request]
jobs:
  tests:
    # (ubuntu-latest est passé à Ubuntu 26.04, que Playwright 1.56 ne gère pas encore : on reste sur 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Installer Playwright
        working-directory: tools/test
        run: npm install && npx playwright install --with-deps chromium
      - name: Lancer les tests
        run: node tools/test/run.mjs
